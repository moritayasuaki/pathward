name: Rust and Lean

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install pinned elan
        env:
          ELAN_SHA256: 620db834935d0da55ac9cda207b2e370e8034061cbb0228af5eb6c14b02f0c0c
        run: |
          curl --fail --location --retry 3 --max-time 180 \
            https://github.com/leanprover/elan/releases/download/v4.2.0/elan-x86_64-unknown-linux-gnu.tar.gz \
            --output "$RUNNER_TEMP/elan.tar.gz"
          printf '%s  %s\n' "$ELAN_SHA256" "$RUNNER_TEMP/elan.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/elan.tar.gz" -C "$RUNNER_TEMP" elan-init
          "$RUNNER_TEMP/elan-init" -y --default-toolchain none --no-modify-path
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Prepare fixed verification tools
        run: make setup
      - name: Verify Rust core, configuration, and server
        run: make rust-check config-check server-check
      - name: Check mount confinement in a private Linux namespace
        run: python3 scripts/linux_mount_check.py
      - name: Build production HTTP binary and smoke-test the CLI
        run: |
          make server-build
          python3 scripts/http_smoke.py
          python3 scripts/runtime_smoke.py
          python3 scripts/deployment_smoke.py
          python3 scripts/load_smoke.py
          python3 scripts/fairness_smoke.py
          cargo +1.99.1 run --offline --locked --release --manifest-path server/Cargo.toml --example fuzz_http -- 100000
      - name: Install pinned local test CA
        run: make acme-test-setup
      - name: Test real TLS-ALPN-01 issuance, renewal, restart and persistence failure
        run: make acme-integration
      - name: Verify extraction, Lean proofs, and axioms
        run: make proof-check

  dependency-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install fixed Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - name: Install pinned HTTP server toolchain
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Install pinned RustSec auditor
        run: make dependency-audit-setup
      - name: Audit core, configuration, HTTP server, and candidate lockfiles
        run: make dependency-audit
      - name: Compile the reviewed candidate
        run: make dependency-check
