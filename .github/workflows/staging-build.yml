name: Staging binaries

on:
  workflow_dispatch:
  push:
    branches: [codex/recovery-guard-upgrade, codex/boot-recovery-proofs, codex/connection-cutover-proofs, codex/modern-http, codex/staging-rehearsal, codex/site-compatibility, codex/browser-staging, codex/admission-diagnostics, codex/nat-capacity, codex/browser-public-staging]
    paths: ["src/**", "server/**", "config/**", "vendor/**", "scripts/load_smoke.py", "scripts/capacity_smoke.py", ".github/workflows/staging-build.yml"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - run: |
          make server-setup acme-test-setup
          cargo +1.99.1 build --offline --locked --release --manifest-path server/Cargo.toml --bins --examples
          cargo +1.99.1 build --offline --locked --release --bin pathward-recovery
          mkdir bundle
          cp server/target/release/pathward-server bundle/
          cp target/release/pathward-recovery bundle/
          cp server/target/release/examples/soak_server bundle/
          cp server/target/release/examples/migration_gate bundle/
          cp server/target/release/examples/acme_probe bundle/
          cp .tools/pebble/pebble bundle/
          cargo +1.99.1 test --offline --locked --manifest-path server/Cargo.toml --lib --no-run --message-format=json > "$RUNNER_TEMP/test-build.json"
          python3 - "$RUNNER_TEMP/test-build.json" <<'PY'
          import json, shutil, sys
          for line in open(sys.argv[1]):
              item = json.loads(line)
              if item.get("reason") == "compiler-artifact" and item.get("executable") and item.get("target", {}).get("name") == "pathward_server":
                  shutil.copy2(item["executable"], "bundle/pathward-server-tests")
          PY
          git rev-parse HEAD > bundle/SOURCE_COMMIT
          cd bundle
          sha256sum pathward-server pathward-recovery soak_server migration_gate acme_probe pebble pathward-server-tests SOURCE_COMMIT > SHA256SUMS
          cat SHA256SUMS
      # Build-only, exact upload directory, no deployment keys or host access.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: staging-linux-amd64
          path: bundle/
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: false
