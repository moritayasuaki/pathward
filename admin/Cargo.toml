[package]
name = "pathward-admin"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
description = "Native, bounded recovery-contract migration for PathWard"

[workspace]
resolver = "3"

[dependencies]
pathward = { path = ".." }
serde = { version = "=1.0.229", default-features = false, features = ["std"] }
serde_json = { version = "=1.0.154", default-features = false, features = ["std"] }
ring = { version = "=0.17.14", default-features = false, features = ["std"] }
rustix = { version = "=1.1.6", default-features = false, features = ["fs", "std", "process", "time"] }

[lints.rust]
unsafe_code = "forbid"
