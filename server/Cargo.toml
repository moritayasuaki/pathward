[package]
name = "pathward-server"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
description = "Bounded HTTP/1.1 static serving with Linux descriptor-based file confinement"

[workspace]
resolver = "3"

[dependencies]
pathward = { path = ".." }
pathward-config = { path = "../config" }
httparse = { version = "=1.10.1", default-features = false }
httpdate = "=1.0.3"

rustls-acme = { path = "../vendor/rustls-acme", default-features = false }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
ring = { version = "=0.17.14", default-features = false, features = ["std"] }
rcgen = { version = "=0.13.2", default-features = false, features = ["pem", "ring", "crypto"] }
pem = { version = "=3.0.6", default-features = false, features = ["std"] }
x509-parser = { version = "=0.18.1", default-features = false }
futures-lite = { version = "=2.6.1", default-features = false, features = ["std"] }
async-io = { version = "=2.6.0", default-features = false }
webpki-roots = { version = "=1.0.11", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "=1.1.6", default-features = false, features = ["fs", "std", "process"] }

[lints.rust]
unsafe_code = "forbid"
